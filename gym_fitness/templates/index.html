{% extends "base.html" %}


{% block content %}


<div class="container">


<div class="hero">


<h1>
     Gym & Fitness
</h1>


<p class="muted">

    Enter your information to generate
    a personalized fitness plan.

</p>


<form id="fitnessForm">


<div class="grid">


<div class="card">


<label>
    Name
</label>

<input
    id="name"
    type="text"
    placeholder="Enter your name"
    required
>


<label>
    Age
</label>

<input
    id="age"
    type="number"
    min="13"
    max="100"
    required
>


<label>
    Gender
</label>

<select id="gender">

    <option>
        Prefer not to say
    </option>

    <option>
        Male
    </option>

    <option>
        Female
    </option>

</select>


<label>
    Height (cm)
</label>

<input
    id="height"
    type="number"
    min="100"
    max="250"
    step="0.1"
    required
>


<label>
    Weight (kg)
</label>

<input
    id="weight"
    type="number"
    min="25"
    max="300"
    step="0.1"
    required
>


</div>


<div class="card">


<label>
    Fitness Goal
</label>

<select id="goal">

    <option>
        Weight Loss
    </option>

    <option>
        Muscle Gain
    </option>

    <option>
        General Fitness
    </option>

</select>


<label>
    Activity Level
</label>

<select id="activity">

    <option>
        Beginner
    </option>

    <option>
        Intermediate
    </option>

    <option>
        Advanced
    </option>

</select>


<label>
    Food Preference
</label>

<select id="food">

    <option>
        Veg
    </option>

    <option>
        Non-Veg
    </option>

    <option>
        Vegan
    </option>

</select>


<div class="alert">

    This project provides
    educational fitness recommendations
    and is not medical advice.

</div>


</div>


</div>


<button type="submit">

    Continue to Body Scan →

</button>


</form>


</div>


</div>


<script>


document
    .getElementById("fitnessForm")
    .addEventListener(
        "submit",
        function(event) {


        event.preventDefault();


        const profile = {

            name:
                document
                .getElementById("name")
                .value,

            age:
                document
                .getElementById("age")
                .value,

            gender:
                document
                .getElementById("gender")
                .value,

            height:
                document
                .getElementById("height")
                .value,

            weight:
                document
                .getElementById("weight")
                .value,

            goal:
                document
                .getElementById("goal")
                .value,

            activity:
                document
                .getElementById("activity")
                .value,

            food:
                document
                .getElementById("food")
                .value

        };


        sessionStorage.setItem(

            "fitnessProfile",

            JSON.stringify(profile)

        );


        window.location.href =
            "/scan";

    });


</script>


{% endblock %}
